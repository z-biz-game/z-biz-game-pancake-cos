name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler: the game ships plain ES modules, so the site is a file copy. Only these paths
      # are reachable from index.html — keeping the server, the gate harness, the tests and the docs
      # out of the artifact also keeps `path: .` from uploading the whole repo.
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js _site/
      # Action versions are the ones that actually exist: configure-pages@v5 /
      # upload-pages-artifact@v3 / deploy-pages@v4. The older triple (v3/v1/v2) 404s on the
      # marketplace while the run still reports green, which is how a deploy silently stops
      # deploying.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
